
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | GAME NEXUS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #09090B;
            color: #FAFAFA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .reset-card {
            background: #18181B;
            border: 1px solid #303036;
            border-radius: 16px;
            padding: 35px;
            width: 100%;
            max-width: 430px;
        }

        .brand {
            color: #818CF8;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .form-control {
            background: #09090B;
            border: 1px solid #3F3F46;
            color: white;
            padding: 12px;
        }

        .form-control:focus {
            background: #09090B;
            color: white;
            border-color: #6366F1;
            box-shadow: 0 0 0 0.2rem #6366F133;
        }

        .form-control::placeholder {
            color: #71717A;
        }

        .btn-reset {
            background: #6366F1;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
        }

        .btn-reset:hover {
            background: #4F46E5;
            color: white;
        }

        #message {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="reset-card">
        <div class="text-center mb-4">
            <h3 class="brand">GAME NEXUS</h3>
            <h4 class="mt-3">Reset Your Password</h4>
            <p class="text-secondary">
                Create a new password for your account.
            </p>
        </div>

        <form id="resetForm">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    class="form-control"
                    placeholder="Enter new password"
                    minlength="8"
                    maxlength="128"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Confirm new password"
                    minlength="8"
                    maxlength="128"
                    required
                >
            </div>

            <button type="submit" class="btn btn-reset w-100">
                Reset Password
            </button>
        </form>

        <div id="message" class="mt-3 text-center" role="status"></div>

        <div class="text-center mt-4">
            <a href="/login.html" class="text-decoration-none">
                Back to Login
            </a>
        </div>
    </div>

    <script>
        const resetForm = document.getElementById("resetForm");
        const message = document.getElementById("message");

        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        if (!token) {
            resetForm.style.display = "none";
            message.textContent = "Invalid reset link. Please request a new one.";
            message.style.color = "#F87171";
        }

        resetForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (newPassword.length < 8 || newPassword.length > 128) {
                message.textContent =
                    "Password must contain 8 to 128 characters.";
                message.style.color = "#F87171";
                return;
            }

            if (newPassword !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                message.style.color = "#F87171";
                return;
            }

            try {
                const response = await fetch("/api/auth/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.detail || "Password reset failed."
                    );
                }

                message.textContent =
                    "Password reset successfully! Redirecting to login...";
                message.style.color = "#4ADE80";

                resetForm.reset();

                setTimeout(() => {
                    window.location.href = "/login.html";
                }, 2000);

            } catch (error) {
                message.textContent = error.message;
                message.style.color = "#F87171";
            }
        });
    </script>

</body>
</html>
